<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#0d1117; color:#c9d1d9; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden }
#container { width:100vw; height:100vh; position:relative }
svg { width:100%; height:100%; cursor:grab }
svg:active { cursor:grabbing }
.tooltip { position:fixed; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:10px 14px; font-size:13px; pointer-events:none; opacity:0; z-index:100; max-width:360px; box-shadow:0 8px 24px rgba(0,0,0,.4); line-height:1.5 }
.tooltip.visible { opacity:1 }
.tooltip .tt-label { color:#f0f6fc; font-weight:600; font-size:14px }
.tooltip .tt-meta { color:#8b949e; font-size:12px; margin-top:4px }
.tooltip .tt-file { color:#58a6ff; font-size:11px; margin-top:2px; word-break:break-all }
.legend { position:fixed; top:16px; right:16px; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:12px; z-index:50; max-height:80vh; overflow-y:auto; min-width:160px; font-size:12px; display:none }
.legend h3 { font-size:13px; margin-bottom:8px; color:#f0f6fc; font-weight:600 }
.legend-item { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer }
.legend-item:hover { background:#1c2128 }
.legend-color { width:10px; height:10px; border-radius:50%; flex-shrink:0 }
.legend-text { color:#8b949e; flex:1 }
.legend-count { color:#484f58; font-size:10px }
.legend-relation { display:flex; align-items:center; gap:6px; padding:1px 0 }
.legend-line { height:2px; border-radius:1px; flex-shrink:0; opacity:.6 }
.controls { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:50; display:flex; gap:8px; align-items:center; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 14px; font-size:12px; flex-wrap:wrap; justify-content:center }
.controls label { color:#8b949e }
.controls select,.controls button { background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer }
.controls select:hover,.controls button:hover { background:#30363d }
.controls button.active { background:#1f6feb; border-color:#1f6feb }
.search-box { position:fixed; top:16px; left:16px; z-index:50 }
.search-box input { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 12px; color:#c9d1d9; font-size:13px; width:220px; outline:none }
.search-box input:focus { border-color:#1f6feb }
.node-label { pointer-events:none; font-size:10px; fill:#8b949e; text-anchor:middle; opacity:0 }
.node-label.visible { opacity:1 }
.node { cursor:pointer }
.stats { position:fixed; bottom:60px; left:16px; z-index:50; color:#484f58; font-size:11px; line-height:1.4 }
</style>
</head>
<body>

<div class="search-box">
  <input id="search" type="text" placeholder="Search nodes..." oninput="filterGraph(this.value)">
</div>
<div class="legend" id="legend"></div>
<div class="controls" id="controls">
  <label>Layout</label>
  <select id="layoutSelect" onchange="switchLayout(this.value)">
    <option value="force">Force</option>
    <option value="radial">Radial</option>
  </select>
  <label>Labels</label>
  <button id="labelsBtn" class="active" onclick="setLabels('all')">On</button>
  <button id="labelsHoverBtn" onclick="setLabels('hover')">Hover</button>
  <button onclick="toggleLegend()">Legend</button>
  <button onclick="resetView()">Reset</button>
</div>
<div class="stats" id="stats"></div>
<div class="tooltip" id="tooltip"></div>
<div id="container"><svg id="graph"></svg></div>

","t":"general_asset_icon","r":"derived_from"}]};

const width = window.innerWidth;
const height = window.innerHeight;
const colors = d3.scaleSequential(d3.interpolateRainbow).domain([0, 75]);
const fileTypeColors = {'code':'#58a6ff','document':'#3fb950','image':'#d29922','audio':'#f85149','rationale':'#bc8cff'};
const relationColors = {'imports':'#58a6ff','uses':'#3fb950','calls':'#f0883e','contains':'#7ee787','defines':'#d2a8ff','inherits':'#ff7b72','integrates':'#a5d6ff','tests':'#bbf0d2'};
const defRelColor = '#484f58';

const svg = d3.select('#graph').attr('width',width).attr('height',height);
const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.1,8]).on('zoom',(e)=>g.attr('transform',e.transform)));

const tooltip = d3.select('#tooltip');
const statsDiv = d3.select('#stats');

let showLabels = 'all';
let layoutMode = 'force';
let nodeSizeMode = 'degree';
let filteredData = null;
let legendVisible = false;

const nodesMap = new Map();
graphData.n.forEach(n=>{nodesMap.set(n.i,n);n.degree=0;});
graphData.l.forEach(l=>{nodesMap.get(l.s).degree++;nodesMap.get(l.t).degree++;});

let nodes = [...nodesMap.values()];
let links = graphData.l.map(l=>({source:l.s,target:l.t,relation:l.r}));

const communityNodes = d3.group(nodes,d=>d.c);
const communityColors = new Map();
communityNodes.forEach((v,k)=>{communityColors.set(k,colors(k));});

function getRelationColor(r){return relationColors[r]||defRelColor;}
function getNodeRadius(d){
  if(nodeSizeMode==='uniform') return 4;
  const maxD = Math.max(...nodes.map(n=>n.degree),1);
  return 3+(d.degree/maxD)*7;
}

function buildLegend(){
  const leg = d3.select('#legend');
  leg.html('<h3>Communities</h3>');
  [...communityNodes.entries()].sort((a,b)=>b[1].length-a[1].length).forEach(([cid,nds])=>{
    const div = leg.append('div').attr('class','legend-item').on('click',()=>highlightCommunity(cid));
    div.append('span').attr('class','legend-color').style('background',communityColors.get(cid));
    div.append('span').attr('class','legend-text').text('C'+cid);
    div.append('span').attr('class','legend-count').text(nds.length);
  });
  leg.append('h3').style('margin-top','10px').text('File Types');
  Object.entries(fileTypeColors).forEach(([t,c])=>{
    const div = leg.append('div').attr('class','legend-item');
    div.append('span').attr('class','legend-color').style('background',c);
    div.append('span').attr('class','legend-text').text(t);
  });
  leg.append('h3').style('margin-top','10px').text('Relations');
  Object.entries(relationColors).forEach(([r,c])=>{
    const dd = leg.append('div').attr('class','legend-relation');
    dd.append('span').attr('class','legend-line').style('background',c).style('width','14px');
    dd.append('span').attr('class','legend-text').text(r);
  });
}

function toggleLegend(){
  legendVisible=!legendVisible;
  d3.select('#legend').style('display',legendVisible?'block':'none');
}

function simulation(){
  svg.selectAll('g > *').remove();
  const simNodes = filteredData?filteredData.n:nodes;
  const simLinks = filteredData?filteredData.l:links;

  if(layoutMode==='radial'){
    radialLayout(simNodes,simLinks); return;
  }

  const sim = d3.forceSimulation(simNodes)
    .force('link',d3.forceLink(simLinks).id(d=>d.i).distance(50).strength(0.3))
    .force('charge',d3.forceManyBody().strength(-150))
    .force('center',d3.forceCenter(width/2,height/2))
    .force('collision',d3.forceCollide().radius(d=>getNodeRadius(d)*1.5));

  const lg = g.append('g').attr('class','links');
  const ng = g.append('g').attr('class','nodes');

  const link = lg.selectAll('line').data(simLinks).join('line')
    .attr('stroke',d=>getRelationColor(d.relation))
    .attr('stroke-width',0.7).attr('opacity',0.3);

  const node = ng.selectAll('g').data(simNodes).join('g').attr('class','node');

  node.append('circle')
    .attr('r',d=>getNodeRadius(d))
    .attr('fill',d=>communityColors.get(d.c))
    .attr('stroke','#0d1117').attr('stroke-width',1.2).attr('opacity',0.85);

  node.append('text').attr('class','node-label')
    .attr('dy',d=>getNodeRadius(d)+12)
    .attr('opacity',d=>showLabels==='all'?1:0)
    .text(d=>showLabels==='all'?d.l:'');

  node.call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;})
  );

  node.on('mouseenter',function(e,d){
    d3.select(this).select('circle').attr('opacity',1).attr('stroke','#f0f6fc').attr('stroke-width',2);
    d3.select(this).select('text').attr('opacity',1);
    const ci = new Set([d.i]);
    simLinks.forEach(l=>{
      const si=l.source.i||l.source; const ti=l.target.i||l.target;
      if(si===d.i)ci.add(ti); if(ti===d.i)ci.add(si);
    });
    link.attr('opacity',l=>{const si=l.source.i||l.source;const ti=l.target.i||l.target;return(si===d.i||ti===d.i)?0.8:0.06;})
      .attr('stroke-width',l=>{const si=l.source.i||l.source;const ti=l.target.i||l.target;return(si===d.i||ti===d.i)?1.8:0.5;});
    node.select('circle').attr('opacity',n=>ci.has(n.i)?1:0.12);
    node.select('text').attr('opacity',n=>ci.has(n.i)&&showLabels==='all'?1:0);
    tooltip.classed('visible',true)
      .html('<div class="tt-label">'+d.l+'</div><div class="tt-meta">Community '+d.c+' &middot; Degree '+d.degree+'</div><div class="tt-file">'+(d.f||'')+'</div>')
      .style('left',(e.clientX+16)+'px').style('top',(e.clientY-10)+'px');
  }).on('mousemove',function(e){
    tooltip.style('left',(e.clientX+16)+'px').style('top',(e.clientY-10)+'px');
  }).on('mouseleave',function(){
    d3.select(this).select('circle').attr('opacity',0.85).attr('stroke','#0d1117').attr('stroke-width',1.2);
    if(showLabels!=='all')d3.select(this).select('text').attr('opacity',0);
    link.attr('opacity',0.3).attr('stroke-width',0.7);
    node.select('circle').attr('opacity',0.85);
    node.select('text').attr('opacity',d=>showLabels==='all'?1:0);
    tooltip.classed('visible',false);
  });

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>'translate('+d.x+','+d.y+')');
  });
  updateStats(simNodes,simLinks);
}

function radialLayout(simNodes,simLinks){
  const cx=width/2,cy=height/2,rad=Math.min(width,height)*0.35;
  const maxD=Math.max(...simNodes.map(d=>d.degree),1);
  simNodes.forEach((d,i)=>{
    const a=(i/simNodes.length)*2*Math.PI-Math.PI/2;
    const r=rad*(0.5+0.5*(d.degree/maxD));
    d.x=cx+r*Math.cos(a); d.y=cy+r*Math.sin(a);
  });

  const lg=g.append('g').attr('class','links');
  const ng=g.append('g').attr('class','nodes');

  lg.selectAll('line').data(simLinks).join('line')
    .attr('x1',d=>d.source.x||nodesMap.get(d.source.i||d.source).x)
    .attr('y1',d=>d.source.y||nodesMap.get(d.source.i||d.source).y)
    .attr('x2',d=>d.target.x||nodesMap.get(d.target.i||d.target).x)
    .attr('y2',d=>d.target.y||nodesMap.get(d.target.i||d.target).y)
    .attr('stroke',d=>getRelationColor(d.relation))
    .attr('stroke-width',0.6).attr('opacity',0.3);

  const node=ng.selectAll('g').data(simNodes).join('g').attr('class','node');
  node.append('circle').attr('cx',d=>d.x).attr('cy',d=>d.y)
    .attr('r',d=>getNodeRadius(d))
    .attr('fill',d=>communityColors.get(d.c))
    .attr('stroke','#0d1117').attr('stroke-width',1.2).attr('opacity',0.85);
  node.append('text').attr('x',d=>d.x).attr('y',d=>d.y+getNodeRadius(d)+12)
    .attr('class','node-label').attr('opacity',d=>showLabels==='all'?1:0)
    .text(d=>showLabels==='all'?d.l:'');

  node.on('mouseenter',function(e,d){
    d3.select(this).select('circle').attr('opacity',1).attr('stroke','#f0f6fc').attr('stroke-width',2);
    d3.select(this).select('text').attr('opacity',1);
    tooltip.classed('visible',true)
      .html('<div class="tt-label">'+d.l+'</div><div class="tt-meta">Community '+d.c+' &middot; Degree '+d.degree+'</div><div class="tt-file">'+(d.f||'')+'</div>')
      .style('left',(e.clientX+16)+'px').style('top',(e.clientY-10)+'px');
  }).on('mousemove',function(e){
    tooltip.style('left',(e.clientX+16)+'px').style('top',(e.clientY-10)+'px');
  }).on('mouseleave',function(){
    d3.select(this).select('circle').attr('opacity',0.85).attr('stroke','#0d1117').attr('stroke-width',1.2);
    tooltip.classed('visible',false);
  });
  updateStats(simNodes,simLinks);
}

function highlightCommunity(cid){
  g.selectAll('.node circle').attr('opacity',d=>d.c===cid?1:0.12);
  g.selectAll('.node text').attr('opacity',d=>d.c===cid&&showLabels==='all'?1:0);
  g.selectAll('.links line').attr('opacity',l=>{
    const si=l.source.i||l.source,ti=l.target.i||l.target;
    const sn=nodesMap.get(si),tn=nodesMap.get(ti);
    return(sn&&sn.c===cid)||(tn&&tn.c===cid)?0.6:0.04;
  });
}

function filterGraph(query){
  if(!query.trim()){filteredData=null;simulation();return;}
  const q=query.toLowerCase();
  const matched=new Set();
  const fn=nodes.filter(n=>{
    if(n.l.toLowerCase().includes(q)||n.i.toLowerCase().includes(q)||n.f.toLowerCase().includes(q)){
      matched.add(n.i);return true;
    }return false;
  });
  const fl=links.filter(l=>{
    const si=l.source.i||l.source,ti=l.target.i||l.target;
    if(matched.has(si)&&matched.has(ti))return true;
    if(matched.has(si)&&nodesMap.get(ti)){matched.add(ti);return true;}
    if(matched.has(ti)&&nodesMap.get(si)){matched.add(si);return true;}
    return false;
  });
  filteredData={n:[...matched].map(id=>nodesMap.get(id)).filter(Boolean),l:fl};
  simulation();
}

function setLabels(m){showLabels=m;
  d3.select('#labelsBtn').classed('active',m==='all');
  d3.select('#labelsHoverBtn').classed('active',m==='hover');
  g.selectAll('.node-label').attr('opacity',d=>m==='all'?1:0);
}

function switchLayout(m){layoutMode=m;simulation();}
function resetView(){svg.transition().duration(500).call(d3.zoom().transform,d3.zoomIdentity);}
function updateStats(n,l){statsDiv.text('Nodes: '+n.length+' | Links: '+l.length+' | Communities: '+communityNodes.size);}

buildLegend();
simulation();

window.addEventListener('resize',()=>{
  d3.select('#graph').attr('width',window.innerWidth).attr('height',window.innerHeight);
});
</script>
</body>
